  function codeToSave(c){
    c=String(c).trim().toLowerCase();
    if(c.indexOf("-")<0)return decodeURIComponent(escape(atob(c.replace(/\s+/g,""))));
    var p=c.split("-");
    if(p.length!==4||chk(p.slice(0,3).join("-"))!==p[3])throw 0;
    var coins=parseInt(p[0],36),m=parseInt(p[1],36),o=[];
    if(isNaN(coins)||isNaN(m))throw 0;
    SKINS.forEach(function(k,i){if(Math.floor(m/Math.pow(2,i))%2===1)o.push(k.id);});
    return JSON.stringify({coins:coins,owned:o,eq:{astro:SKINS[parseInt(p[2].charAt(0),36)].id,alien:SKINS[parseInt(p[2].charAt(1),36)].id}});

  function genMaze(w,h){
    var W=2*w+1,H=2*h+1;
    var g=Array.from({length:H},function(){return Array(W).fill(1);});
    var seen=new Set(["0,0"]),st=[[0,0]];
    g[1][1]=0;
    while(st.length){
      var cur=st[st.length-1],x=cur[0],y=cur[1];
      var n=[[1,0],[-1,0],[0,1],[0,-1]].map(function(d){
        return [x+d[0],y+d[1],d[0],d[1]];
      }).filter(function(q){
        return q[0]>=0&&q[1]>=0&&q[0]<w&&q[1]<h&&!seen.has(q[0]+","+q[1]);
      });
      if(!n.length){st.pop();continue;}
      var q=n[Math.floor(Math.random()*n.length)];
      seen.add(q[0]+","+q[1]);
      g[2*y+1+q[3]][2*x+1+q[2]]=0;
      g[2*q[1]+1][2*q[0]+1]=0;
      st.push([q[0],q[1]]);
    }
    for(var i=0;i<w*h/5;i++){
      var xx=1+Math.floor(Math.random()*(W-2)),yy=1+Math.floor(Math.random()*(H-2));
      if(g[yy][xx] && ((xx%2===0)!==(yy%2===0)))g[yy][xx]=0;
    }
    return g;
  }

  function start(key){

    }
    free.sort(function(){return Math.random()-.5;});

    var items=[];

    var hunt=m.mode==="hunt",alienStart=[1,1];

    });

    pendingMission=key;var m=MAPS[key],hunt=m.mode==="hunt",climate=WEATHER[key];
    ov.style.display="flex";setPad(false);
    ov.innerHTML="<h1>Before you launch: "+m.name+"</h1>"+
      "<p>Here’s the mission briefing. You can always pause with <b>Save &amp; Menu</b>.</p>"+
      "<div class='card'><h2>Objective</h2><p>"+(hunt?"You are the alien. Catch the astronaut and land <b>5 strikes</b> before they collect rocket parts and escape through the launch pad in the <b>bottom-right corner</b>.":"Explore the maze, collect every 🔧 rocket part, then reach the 🏗️ rocket-building pad in the <b>bottom-right corner</b> and stay there until the escape rocket is built. Keep oxygen, water, life support and power above zero.")+"</p></div>"+
      "<div class='card'><h2>Controls</h2><p><b>Computer:</b> move with WASD or arrow keys. Use power-ups with 1, 2 or 3 (Space uses slot 1). Hold <b>R</b> while standing still to convert power into life support.</p><p style='margin-top:7px'><b>Phone/tablet:</b> use the on-screen arrows and tap the power buttons. Hold <b>Hold: Repair</b> while still to repair life support.</p></div>"+
      (climate?"<div class='card'><h2>Dynamic conditions: "+climate.icon+" "+climate.label+" cycles</h2><p>Weather arrives in waves. Watch the condition indicator beside your parts counter: "+(key==="moon"?"lunar night dims your view and raises power drain.":key==="mars"?"dust storms cut visibility, slow movement and make hazards more active.":key==="europa"?"ice fog limits visibility, slows movement and increases power use.":"acid clouds reduce visibility, strain life support and speed up hazards.")+" Adapt your route and conserve supplies while the event passes.</p></div>":"")+ 
      "<div class='card'><h2>Helpful tips</h2><p>Collect 💨 oxygen, 💧 water, 🔋 power and 🩹 repair patches. Visit engineering stations and choose one trade-off. 💎 crystals grant a random power. In Hunt mode, use Blink/Surge/Stun and close the distance; one strike lands when you are beside the human.</p></div>"+
      "<div class='btns'><button data-launch='1'>🚀 Start "+m.name+" mission</button><button data-cancelbrief='1'>Back to missions</button></div>"+
      "<p class='tip'>Sound effects: "+(soundOn?"on":"off")+" · You can toggle sound from the mission menu.</p>";
  }

  function open(x,y){return !!(S.g[y]&&S.g[y][x]===0);}

  function updateWeather(dt){
    if(!WEATHER[S.key])return;
    if(S.env){
      S.envT-=dt;
      if(S.envT<=0){S.env=null;S.envT=0;S.envNext=24+Math.random()*18;say("Conditions clearing. Systems returning to normal.",3);}
      return;
    }
    if(typeof S.envNext!=="number"||!isFinite(S.envNext))S.envNext=18;
    S.envNext-=dt;
    if(S.envNext<=0){S.env=Object.assign({},WEATHER[S.key]);S.envT=S.env.duration;sfx("station");say(S.env.icon+" "+S.env.label+" incoming! Visibility and systems affected.",4);}
  }

  function stationAt(x,y){
    if(!S)return null;
    for(var i=0;i<S.stations.length;i++){
      if(S.stations[i].x===x&&S.stations[i].y===y)return S.stations[i];
    }
    return null;
  }

  function collectAt(x,y){
    for(var i=S.items.length-1;i>=0;i--){
      var it=S.items[i];
      if(it.x!==x||it.y!==y)continue;
      if(S.m.mode==="hunt"&&it.t==="r")continue;
      S.items.splice(i,1);
      sfx(it.t==="c"?"power":"pickup");
      if(it.t==="r"){
        S.parts++;
        showFact("Rocket part recovered",FACTS[S.parts%FACTS.length]);
      }else if(it.t==="c"){
        grantPower();
      }else if(it.t==="l"){
        S.meters[2]=Math.min(100,S.meters[2]+25);say("Life support patch +25",2.5);
      }else{
        var k={o:0,w:1,p:3}[it.t];
        S.meters[k]=Math.min(100,S.meters[k]+30);
        say({o:"Oxygen canister +30",w:"Water pack +30",p:"Power cell +30"}[it.t],2.5);
      }
    }
  }

  function step(dx,dy,now){
    if(!S||S.over||S.stationOpen)return;
    var moveDelay=S.shield?147:125;
    if(S.hydroT>0)moveDelay*=1.02;
    if(S.fx.surge>0)moveDelay*=.5;
    if(S.env&&S.env.move)moveDelay*=S.env.move;
    if(now-S.lastMove<moveDelay)return;
    S.face=[dx,dy];
    var nx=S.p.x+dx,ny=S.p.y+dy;
    if(!open(nx,ny))return;
    S.lastMove=now;S.p.x=nx;S.p.y=ny;sfx("move");
    collectAt(nx,ny);

    var st=stationAt(nx,ny);
    if(st && !st.used)openStation(st);

    if(S.m.mode!=="hunt"&&nx===S.W-2&&ny===S.H-2){
      if(S.parts>=S.m.parts)say("Launch pad reached. Hold position to build the escape rocket.",2.5);
      else say("Launch pad: "+(S.m.parts-S.parts)+" more rocket part(s) needed.",2.5);
    }
  }

  function openStation(st){
    if(!S||S.over||S.stationOpen)return;
    sfx("station");
    S.stationOpen=true;S.lastStation=st;
    setPad(false);
    var a=st.type.a,b=st.type.b;
    ov.style.display="flex";
    ov.innerHTML=
      "<h1>"+st.type.icon+" "+st.type.name+"</h1>"+
      "<p>Engineering decision: choose one strategy. Your choice changes the survival systems.</p>"+
      '<div class="choiceGrid">'+
      '<button class="choice" data-choice="a"><b>Option A: '+a.title+"</b>"+a.desc+"</button>"+
      '<button class="choice" data-choice="b"><b>Option B: '+b.title+"</b>"+b.desc+"</button>"+
      "</div>"+
      '<p class="tip">Trade-off thinking: improving one system can consume another limited resource.</p>';
  }

  function applyEffects(e){
    if(e.o)S.meters[0]=clamp(S.meters[0]+e.o,0,100);
    if(e.w)S.meters[1]=clamp(S.meters[1]+e.w,0,100);
    if(e.l)S.meters[2]=clamp(S.meters[2]+e.l,0,100);
    if(e.p)S.meters[3]=clamp(S.meters[3]+e.p,0,100);
  }

  function chooseStation(which){
    var st=S.lastStation;
    if(!st)return;
    var opt=st.type[which];
    applyEffects(opt.effects);
    if(opt.shield!==undefined)S.shield=!!opt.shield;
    if(opt.hydro)S.hydroT=Math.max(S.hydroT,opt.hydro);
    if(opt.solar)S.solarT=Math.max(S.solarT,opt.solar);
    st.used=true;S.stationOpen=false;ov.style.display="none";
    setPad(true);
    say(st.type.name+": "+opt.title,3);
  }

  function showFact(title,fact){
    S.stationOpen=true;
    setPad(false);
    ov.style.display="flex";
    ov.innerHTML=
      "<h1>🔧 "+title+"</h1>"+
      "<div class='card'><h2>NASA space fact</h2><p>"+fact+"</p></div>"+
      "<button data-close='1'>Continue mission</button>"+
      "<p class='tip'>STEM learning moment: real space missions must balance mass, power, consumables, reliability and mission objectives.</p>";
  }

  function closePopup(){
    if(!S)return;
    S.stationOpen=false;ov.style.display="none";
    if(!S.over)setPad(true);
  }

  function updateHazards(dt){
    var md=999;
    S.hazards.forEach(function(a){
      md=Math.min(md,Math.abs(a.x-S.p.x)+Math.abs(a.y-S.p.y));
      a.stun=Math.max(0,a.stun-dt);
      if(a.stun>0)return;
      a.t+=dt*1000;
      if(a.t>=S.m.alienMs/(S.env&&S.env.hazards?S.env.hazards:1)){
        a.t=0;
        var dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(function(d){return open(a.x+d[0],a.y+d[1]);});
        if(!dirs.length)return;
        dirs.sort(function(p,q){
          return (Math.abs(a.x+p[0]-S.p.x)+Math.abs(a.y+p[1]-S.p.y))-
                 (Math.abs(a.x+q[0]-S.p.x)+Math.abs(a.y+q[1]-S.p.y));
        });
        var d=Math.random()<.95?dirs[0]:dirs[Math.floor(Math.random()*dirs.length)];
        a.dx=d[0];a.dy=d[1];a.x+=d[0];a.y+=d[1];
      }
      if(a.x===S.p.x&&a.y===S.p.y&&S.fx.field<=0){
        var damage=S.shield?8:16;
        S.meters[2]=Math.max(0,S.meters[2]-damage);
        S.radiation=Math.min(100,S.radiation+(S.shield?3:6));
        a.stun=2;S.hit=.35;sfx("hit");
        if(navigator.vibrate)try{navigator.vibrate(70);}catch(e){}
        say(S.shield?"Shield absorbed part of the radiation flare.":"Radiation flare hit! Seek cover or activate shielding.",2.5);
      }
    });
    S.danger=md<7?(7-md)/7:0;
  }

  function radiationFlare(dt){
    S.flareT-=dt;
    if(S.flareT>0)return;
    S.flareT=13+Math.random()*12;
    if(S.fx.field>0){say("Radiation flare deflected by Force Field.",3);}
    else if(S.shield){
      S.meters[3]=Math.max(0,S.meters[3]-5);
      say("Radiation flare detected — shielding active. Power -5.",3);
    }else{
      var exposed=Math.max(0,1-S.danger*.65);
      S.radiation=Math.min(100,S.radiation+12*exposed);
      S.meters[2]=Math.max(0,S.meters[2]-8*exposed);
      say("⚠ Radiation flare sweeping the corridors — seek cover or use a Shield Terminal.",3);
    }
    S.hit=.2;
  }

  function consume(dt){
    var factor=1;
    if(S.solarT>0)factor=.80;
    var wx=S.env||{};
    var waterFactor=S.hydroT>0?2:1;
    S.meters[0]=Math.max(0,S.meters[0]-S.m.drain[0]*factor*(wx.oxygen||1)*dt);
    S.meters[1]=Math.max(0,S.meters[1]-S.m.drain[1]*waterFactor*(wx.water||1)*dt);
    S.meters[3]=Math.max(0,S.meters[3]-S.m.drain[3]*(wx.power||1)*dt);

    var lifeRate=S.m.drain[2]*(wx.life||1)*dt;
    if(S.meters[0]<=0)lifeRate*=4;
    if(S.meters[1]<=0)lifeRate*=3;
    if(S.meters[3]<=0)lifeRate*=2;
    S.meters[2]=Math.max(0,S.meters[2]-lifeRate);

    if(S.hydroT>0){
      S.hydroT-=dt;
      S.meters[2]=Math.min(100,S.meters[2]+0.22*dt);
    }
    if(S.solarT>0)S.solarT-=dt;
    for(var f in S.fx)if(S.fx[f]>0)S.fx[f]-=dt;
  }

  function bfsFirst(sx,sy,goals,blk){
    var W=S.W,H=S.H,s=sy*W+sx,prev=new Int32Array(W*H).fill(-1),q=[s],gs={},D=[[1,0],[-1,0],[0,1],[0,-1]];
    prev[s]=s;
    goals.forEach(function(g){gs[g.y*W+g.x]=1;});
    if(gs[s])return "here";
    for(var qi=0;qi<q.length;qi++){
      var c=q[qi],cx=c%W,cy=(c/W)|0;
      for(var di=0;di<4;di++){
        var nx=cx+D[di][0],ny=cy+D[di][1];
        if(!open(nx,ny))continue;
        var n=ny*W+nx;
        if(prev[n]!==-1||(blk&&blk(nx,ny)))continue;
        prev[n]=c;
        if(gs[n]){
          var k=n;while(prev[k]!==s)k=prev[k];
          return [k%W-sx,((k/W)|0)-sy];
        }
        q.push(n);
      }
    }
    return null;
  }

  function humanMove(){
    var h=S.human,W=S.W,H=S.H,goals=S.items.filter(function(i){return i.t==="r";});
    if(!goals.length)goals=[{x:W-2,y:H-2}];
    var ax=S.p.x,ay=S.p.y;
    // dodge: first try to stay 2+ tiles from the alien, then just avoid its tile, then ignore it
    var r=bfsFirst(h.x,h.y,goals,function(x,y){return Math.abs(x-ax)+Math.abs(y-ay)<=1;});
    if(!r)r=bfsFirst(h.x,h.y,goals,function(x,y){return x===ax&&y===ay;});
    if(!r)r=bfsFirst(h.x,h.y,goals,null);
    if(r&&r!=="here"){h.x+=r[0];h.y+=r[1];}
    for(var i=S.items.length-1;i>=0;i--){
      var it=S.items[i];
      if(it.t==="r"&&it.x===h.x&&it.y===h.y){
        S.items.splice(i,1);h.got++;
        say("The human grabbed a rocket part ("+h.got+"/"+S.m.parts+")!",2.5);
      }
    }
  }

  function huntTick(dt,now){
    var h=S.human;
    for(var f in S.fx)if(S.fx[f]>0)S.fx[f]-=dt;
    var dx=0,dy=0;
    if(held){dx=held[0];dy=held[1];}
    else if(keys.ArrowUp||keys.w)dy=-1;
    else if(keys.ArrowDown||keys.s)dy=1;
    else if(keys.ArrowLeft||keys.a)dx=-1;
    else if(keys.ArrowRight||keys.d)dx=1;
    if(dx||dy)step(dx,dy,now);

    h.stun=Math.max(0,h.stun-dt);h.cd=Math.max(0,h.cd-dt);
    var atPad=h.x===S.W-2&&h.y===S.H-2&&h.got>=S.m.parts;
    S.building=atPad;
    if(atPad){
      if(h.stun<=0){
        S.build+=dt/S.m.buildT;
        if(S.msgT<=0)say("The human is building the rocket "+Math.min(99,Math.floor(S.build*100))+"% - stop him!",.5);
      }
    }else S.build=Math.max(0,S.build-dt*.05);

    h.t+=dt*1000;
    if(h.stun<=0&&!atPad&&h.t>=S.m.humanMs){h.t=0;humanMove();}

    if(h.cd<=0&&Math.abs(h.x-S.p.x)+Math.abs(h.y-S.p.y)<=1){
      h.hp-=S.m.dmg;h.stun=S.m.stunT;h.cd=S.m.hitCd;S.hit=.2;sfx("hit");
      S.build=Math.max(0,S.build-.15);
      if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
      say("Strike! Human HP "+Math.max(0,h.hp),2);
      if(h.hp<=0){S.meters[0]=0;end(true);return true;}
    }

    S.meters[0]=Math.max(0,h.hp);
    S.meters[1]=Math.max(0,100*(1-(h.got+clamp(S.build,0,1))/(S.m.parts+1)));
    if(S.build>=1){S.meters[1]=0;end(false,"The human finished the rocket and escaped.");return true;}
    return false;
  }

  function loop(now){
    if(!S||S.over)return;
    if(S.paused){last=now;requestAnimationFrame(loop);return;}
    var dt=Math.min(.1,(now-last)/1000);last=now;
    S.time+=dt;S.msgT-=dt;S.hit=Math.max(0,S.hit-dt);
    saveClock+=dt;if(saveClock>=4){saveClock=0;saveRun();}
    if(!S.stationOpen&&S.m.mode==="hunt"){
      if(huntTick(dt,now))return;
    }else if(!S.stationOpen){
      updateWeather(dt);
      consume(dt);
      var dx=0,dy=0;
      if(held){dx=held[0];dy=held[1];}
      else if(keys.ArrowUp||keys.w)dy=-1;
      else if(keys.ArrowDown||keys.s)dy=1;
      else if(keys.ArrowLeft||keys.a)dx=-1;
      else if(keys.ArrowRight||keys.d)dx=1;
      if(dx||dy)step(dx,dy,now);
      S.repairing=!!((keys.r||keys.R||repHeld)&&!dx&&!dy&&S.meters[3]>3&&S.meters[2]<100);
      if(S.repairing){
        S.meters[3]=Math.max(0,S.meters[3]-2*dt);
        S.meters[2]=Math.min(100,S.meters[2]+2.5*dt);
        if(S.msgT<=0)say("Emergency repair: Power -> Life Support. Hold still.",.5);
      }

      updateHazards(dt);
      radiationFlare(dt);

      S.building=S.p.x===S.W-2&&S.p.y===S.H-2&&S.parts>=S.m.parts;
      if(S.building){
        S.build+=dt/S.m.buildT;
        if(S.msgT<=0)say("Building escape rocket "+Math.min(99,Math.floor(S.build*100))+"%",.5);
        if(S.build>=1){end(true);return;}
      }else S.build=Math.max(0,S.build-dt*.035);

      if(S.meters[0]<=0){end(false,"Oxygen depleted. Life support could no longer sustain the crew.");return;}
      if(S.meters[1]<=0){end(false,"Water reserve depleted.");return;}
      if(S.meters[2]<=0){end(false,"Life support failed.");return;}
      if(S.meters[3]<=0){end(false,"Power grid collapsed.");return;}
    }
    draw();hud();requestAnimationFrame(loop);
  }

  function hud(){
    if(!S)return;
    for(var i=0;i<4;i++){
      var v=clamp(S.meters[i],0,100);
      $("b"+i).style.width=v+"%";
      $("b"+i).className=v<25?"low":"";
      $("v"+i).textContent=Math.floor(v);
    }
    var sl=document.querySelectorAll("#powers [data-slot]");
    for(var j=0;j<3;j++){var pw=S.pw[j];sl[j].textContent=pw?pw.icon+" "+pw.name:(j+1)+" - empty";sl[j].className=pw?"rdy":"";}
    $("rep").className=S.repairing?"act":"";
    $("parts").textContent=S.human?"Human parts "+S.human.got+"/"+S.m.parts:"Parts "+S.parts+"/"+S.m.parts;
    $("weather").textContent=S.env?S.env.icon+" "+S.env.label+" "+Math.max(1,Math.ceil(S.envT))+"s":(WEATHER[S.key]?"☀️ Clear":"—");
    $("msg").textContent=S.msgT>0?S.msg:"";
    var t=Math.floor(S.time);
    $("time").textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
  }

  var ICON={o:"💨",w:"💧",p:"🔋",r:"🔧",c:"💎",l:"🩹"};

  function draw(){
    if(!S)return;
    var g=S.g,W=S.W,H=S.H,p=S.p,m=S.m;
    var cx=Math.max(0,Math.min(W-VW,p.x-(VW>>1)));
    var cy=Math.max(0,Math.min(H-VH,p.y-(VH>>1)));

    ctx.fillStyle="#000";ctx.fillRect(0,0,cv.width,cv.height);

    for(var y=0;y<VH;y++)for(var x=0;x<VW;x++){
      var gx=x+cx,gy=y+cy;
      if(!g[gy]||g[gy][gx]===undefined)continue;
      ctx.fillStyle=g[gy][gx]?m.wall:((gx+gy)%2?m.floor:m.floor2);
      ctx.fillRect(x*T,y*T,T,T);
      if(g[gy][gx]){
        ctx.fillStyle="rgba(255,255,255,.06)";
        ctx.fillRect(x*T,y*T,T,3);
      }
    }

    function at(gx,gy,s,font){
      if(gx>=cx&&gx<cx+VW&&gy>=cy&&gy<cy+VH){
        ctx.font=font||"21px serif";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillStyle="#ffffff";
        ctx.fillText(s,(gx-cx)*T+T/2,(gy-cy)*T+T/2+1);
      }
    }

    at(W-2,H-2,S.build>0?"🚀":"🏗️","23px serif");
    S.items.forEach(function(i){
      if(m.beginner){
        if(Math.abs(i.x-p.x)+Math.abs(i.y-p.y)<=4)i.seen=true;
        if(!i.seen)return;
      }
      at(i.x,i.y,ICON[i.t],"21px serif");
    });

    S.stations.forEach(function(st){
      if(st.used)return;
      at(st.x,st.y,st.type.icon,"20px serif");
    });

    S.hazards.forEach(function(a){at(a.x,a.y,"☢","20px sans-serif");});
    if(S.human){
      var hm=S.human;
      at(hm.x,hm.y,hm.stun>0?"😵":"🧑‍🚀","22px serif");
      if(hm.x>=cx&&hm.x<cx+VW&&hm.y>=cy&&hm.y<cy+VH){
        var hbx=(hm.x-cx)*T+4,hby=(hm.y-cy)*T-1;
        ctx.fillStyle="#400";ctx.fillRect(hbx,hby,T-8,4);
        ctx.fillStyle=hm.hp>40?"#4fb3a4":"#e04a4a";ctx.fillRect(hbx,hby,(T-8)*clamp(hm.hp/100,0,1),4);
      }
    }
    var sk=playerSkin();
    if(sk.aura&&p.x>=cx&&p.x<cx+VW&&p.y>=cy&&p.y<cy+VH){
      var ax0=(p.x-cx)*T+T/2,ay0=(p.y-cy)*T+T/2,ag=ctx.createRadialGradient(ax0,ay0,2,ax0,ay0,T*.8);
      ag.addColorStop(0,sk.aura);ag.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=ag;ctx.fillRect(ax0-T,ay0-T,T*2,T*2);
    }
    at(p.x,p.y,sk.icon,"22px serif");

    var px=(p.x-cx)*T+T/2,py=(p.y-cy)*T+T/2;
    if(S.fx.field>0||S.repairing){ctx.strokeStyle=S.fx.field>0?"rgba(98,168,255,.9)":"rgba(79,179,164,.9)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,T*.7,0,6.283);ctx.stroke();}
    var r=m.vis*T*(S.fx.scan>0?1.7:1)*(S.env&&S.env.vis?S.env.vis:1)*(1+.04*Math.sin(S.time*7));
    var f=ctx.createRadialGradient(px,py,r*.5,px,py,r);
    f.addColorStop(0,"rgba(5,8,18,0)");
    f.addColorStop(1,"rgba(5,8,18,.96)");
    ctx.fillStyle=f;ctx.fillRect(0,0,cv.width,cv.height);
    if(S.env&&S.env.tint){ctx.fillStyle=S.env.tint;ctx.fillRect(0,0,cv.width,cv.height);}

    if(S.danger>0){
      ctx.fillStyle="rgba(150,30,20,"+(S.danger*.18)+")";
      ctx.fillRect(0,0,cv.width,cv.height);
    }
    if(S.hit>0){
      ctx.fillStyle="rgba(255,70,60,"+S.hit+")";
      ctx.fillRect(0,0,cv.width,cv.height);
    }
    if(m.beginner){
      var k=Math.max(2,Math.floor(Math.min(110/W,80/H))),x0=cv.width-W*k-6,y0=6;
      ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(x0-2,y0-2,W*k+4,H*k+4);
      for(var my=0;my<H;my++)for(var mx=0;mx<W;mx++){
        ctx.fillStyle=g[my][mx]?"#25343c":"#6f8c99";
        ctx.fillRect(x0+mx*k,y0+my*k,k,k);
      }
      S.items.forEach(function(i){
        if(!i.seen)return;
        ctx.fillStyle=i.t==="r"?"#d2c86a":(i.t==="c"?"#62a8ff":"#cfd6e7");
        ctx.fillRect(x0+i.x*k-1,y0+i.y*k-1,k+2,k+2);
      });
      ctx.fillStyle="#4fb3a4";ctx.fillRect(x0+(W-2)*k-1,y0+(H-2)*k-1,k+3,k+3);
      ctx.fillStyle=(Math.floor(S.time*3)%2)?"#ffe066":"#ff8a00";
      ctx.fillRect(x0+p.x*k-1,y0+p.y*k-1,k+3,k+3);
    }
    if(S.human){
      var hh=S.human,hsx=(hh.x-cx)*T+T/2,hsy=(hh.y-cy)*T+T/2;
      if(hsx<0||hsy<0||hsx>cv.width||hsy>cv.height){
        var ex=cv.width/2,ey=cv.height/2,vx=hsx-ex,vy=hsy-ey;
        var tt=Math.min((ex-20)/Math.max(1,Math.abs(vx)),(ey-20)/Math.max(1,Math.abs(vy)));
        var ax2=ex+vx*tt,ay2=ey+vy*tt,ang=Math.atan2(vy,vx);
        ctx.save();ctx.translate(ax2,ay2);ctx.rotate(ang);
        ctx.fillStyle="#ff4d4d";ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-9,-9);ctx.lineTo(-9,9);ctx.closePath();ctx.fill();
        ctx.restore();
        ctx.fillStyle="#fff";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(String(Math.abs(hh.x-p.x)+Math.abs(hh.y-p.y)),ax2-Math.cos(ang)*20,ay2-Math.sin(ang)*20);
      }
    }
    if(S.build>0){
      var bw=Math.min(250,cv.width-40),bx=(cv.width-bw)/2;
      ctx.fillStyle="rgba(0,0,0,.75)";ctx.fillRect(bx-2,cv.height-27,bw+4,17);
      ctx.fillStyle="#d2c86a";ctx.fillRect(bx,cv.height-25,bw*clamp(S.build,0,1),13);
    }
  }

  function end(win,why){
    if(!S)return;
    sfx(win?"win":"fail");S.over=true;clearRun();var unlockedNow=checkBadges(win),runScore=recordScore(win);draw();hud();
    setPad(false);
    var t=Math.floor(S.time),o=S.meters.map(function(v){return Math.floor(v);});
    ov.style.display="flex";
    if(S.m.mode==="hunt"){
      ov.innerHTML=win
        ?"<h1>👽 Human eliminated</h1><p>You stopped the escape in "+Math.floor(t/60)+"m "+(t%60)+"s.</p>"
        :"<h1>💀 The human escaped</h1><p>"+why+" The rocket is gone, and so are you.</p>";
      ov.innerHTML+="<div class='card'>Human HP: "+Math.max(0,Math.floor(S.human.hp))+"%<br>Rocket parts he collected: "+S.human.got+"/"+S.m.parts+"</div>"+
        (function(){var hEarn=missionReward(win);save.coins+=hEarn;persist();return "<div class='card' style='text-align:center'><b style='font-size:18px;color:var(--amber)'>\uD83E\uDE99 +"+hEarn+" coins</b><br>"+(win?"Human eliminated bonus":"Strikes landed: "+huntHits()+" (15 coins each)")+"<br>Total: "+save.coins+" coins</div>";})()+
        "<div class='card' style='text-align:center'><b style='color:var(--amber)'>Run score: "+runScore.toLocaleString()+"</b></div><div class='btns'><button data-go='hunt'>Hunt again</button><button data-shop='1'>\uD83D\uDECD\uFE0F Skin shop</button><button data-go='menu'>Choose mission</button><button data-board='1'>🏆 Leaderboard</button></div>";
      ov.innerHTML+=badgeNotice(unlockedNow);
      return;
    }
    ov.innerHTML=win
      ?"<h1>🚀 Launch successful!</h1>"+
       "<p>You completed the "+S.m.name+" escape in "+Math.floor(t/60)+"m "+(t%60)+"s.</p>"+
       "<div class='card'><b>Final reserves</b><br>Oxygen "+o[0]+"% · Water "+o[1]+"% · Life Support "+o[2]+"% · Power "+o[3]+"%</div>"+
       "<p>You managed consumables, power, engineering modules and radiation hazards while collecting every rocket part.</p>"
      :"<h1>Mission failed</h1><p>"+why+"</p>"+
       "<div class='card'>Rocket parts: "+S.parts+"/"+S.m.parts+
       "<br>Radiation exposure: "+Math.floor(S.radiation)+"%"+
       "<br>Final reserves: "+o.join("% · ")+"%</div>";
    if(S.m.reward){
      var earned=missionReward(win);
      save.coins+=earned;persist();
      var pct=Math.floor(100*S.parts/S.m.parts);
      ov.innerHTML+="<div class='card' style='text-align:center'><b style='font-size:18px;color:var(--amber)'>\uD83E\uDE99 +"+earned+" coins</b><br>"+
        (win?"Mission complete bonus":"Rocket parts collected: "+pct+"%"+(earned?"":" (collect at least 25% to earn coins)"))+
        "<br>Total: "+save.coins+" coins</div>";
    }
    ov.innerHTML+=badgeNotice(unlockedNow)+"<div class='card' style='text-align:center'><b style='color:var(--amber)'>Run score: "+runScore.toLocaleString()+"</b></div><div class='btns'><button data-go='"+S.key+"'>Try "+S.m.name+" again</button><button data-shop='1'>\uD83D\uDECD\uFE0F Skin shop</button><button data-go='menu'>Choose mission</button><button data-board='1'>🏆 Leaderboard</button></div>";
  }


  function menu(){
    if(S){S.stationOpen=false;S.paused=true;saveRun();}
    setPad(false);
    ov.style.display="flex";
    ov.innerHTML=
      "<h1>Escape Protocol: The Hive</h1>"+
      "<p><b>NASA STEM Trade-Off Edition</b></p>"+
      (resumeRun?"<button data-resume='1' style='width:min(520px,100%);border-color:var(--ok);color:var(--ok)'>▶ Resume saved "+MAPS[resumeRun.key].name+" mission · "+Math.floor(resumeRun.time||0)+"s elapsed</button>":"")+
      "<div class='btns' style='align-items:center'><span class='stationTag' style='font-size:14px;padding:8px 10px'>\uD83E\uDE99 "+save.coins+" coins</span><button data-acct='1'>\uD83D\uDCBE Save</button><button data-shop='1'>\uD83D\uDECD\uFE0F Skin shop</button><button data-board='1'>🏆 Leaderboard</button><button data-achievements='1'>🏅 Achievements ("+achState.unlocked.length+"/"+BADGES.length+")</button><button data-sound='1'>"+(soundOn?"🔊 Sound on":"🔇 Sound off")+"</button></div>"+
      "<p class='tip'>Earn coins on Moon, Mars, Europa, Venus and Hunt. Moon: 100 for a win. Mars: 150 for a win. Europa: 135 for a win. Venus: 165 for a win. Hunt: 120 for a win, 15 per strike. Partial parts still pay out (25% / 50% / 75% / 100%). Training pays no coins.</p>"+
      "<p>Explore the maze, recover every rocket part and reach the launch pad. Along the way, make engineering decisions that trade power, water, oxygen, mobility and protection against radiation.</p>"+
      "<div class='card'><b>Mission systems</b><p>Oxygen drains steadily. Water supports the habitat. Life Support falls faster when oxygen is gone. Power runs your systems. Radiation flares create additional risk.</p></div>"+
      "<div class='lg'>"+
      "<span><b>🧑‍🚀</b>You</span><span><b>☢</b>Radiation flare / hazard</span>"+
      "<span><b>🔧</b>Rocket part</span><span><b>♻️</b>Sabatier Scrubber</span>"+
      "<span><b>🌱</b>Hydroponics Bay</span><span><b>🛡️</b>Regolith Shield</span>"+
      "<span><b>☀️</b>Solar Array</span><span><b>🏗️</b>Launch pad</span>"+
      "<span><b>💎</b>Power crystal (random superpower)</span><span><b>🩹</b>Life-support patch +25</span>"+
      "<span><b>🛠️</b>Life Support Repair Bay</span><span><b>🔧</b>Hold Repair: Power to Life Support</span>"+
      "</div>"+
      "<p class='tip'>Every engineering terminal offers two choices. There is no universally perfect option — the best decision depends on your current resources and mission situation.</p>"+
      "<div class='choiceGrid'>"+
      "<button class='choice' style='grid-column:1/-1' data-go='training'><b>🎓 Training mission (beginner)</b>"+MAPS.training.desc+"<br><span class='stationTag'>"+MAPS.training.parts+" parts</span> <span class='stationTag'>Minimap</span> <span class='stationTag'>Gentle drain</span></button>"+
      "<button class='choice' data-go='moon'><b>🌕 Moon mission</b>"+MAPS.moon.desc+"<br><span class='stationTag'>"+MAPS.moon.parts+" parts</span> <span class='stationTag'>Lower drain</span></button>"+
      "<button class='choice' data-go='mars'><b>🔴 Mars mission</b>"+MAPS.mars.desc+"<br><span class='stationTag'>"+MAPS.mars.parts+" parts</span> <span class='stationTag'>Harsher</span></button>"+
      "<button class='choice' data-go='europa'><b>🧊 Europa mission</b>"+MAPS.europa.desc+"<br><span class='stationTag'>"+MAPS.europa.parts+" parts</span> <span class='stationTag'>Water-rich · low visibility</span></button>"+
      "<button class='choice' data-go='venus'><b>🔥 Venus mission</b>"+MAPS.venus.desc+"<br><span class='stationTag'>"+MAPS.venus.parts+" parts</span> <span class='stationTag'>Extreme drain · high hazards</span></button>"+
      "<button class='choice' style='grid-column:1/-1' data-go='hunt'><b>👽 Hunt mode</b>"+MAPS.hunt.desc+"<br><span class='stationTag'>You are the alien</span> <span class='stationTag'>Fast human</span> <span class='stationTag'>He escapes = you die</span></button>"+
      "</div>"+
      "<p class='tip'>Keyboard: WASD or arrows · 1/2/3 or Space = superpower · hold R = emergency repair (stand still) · Touch: on-screen pad and top buttons · Collect rocket parts, visit stations, build at the launch pad.</p>"+
      "<div class='card' id='aiNotice'><b style='color:var(--amber)'>🤖 AI / SI generation notice</b><p>This game was generated with the help of artificial intelligence (AI / SI): Claude, by Anthropic. The code, game text and space facts were AI-generated from the human creator's ideas, direction and testing. Resource values are simplified game-model numbers, not real engineering data. Unofficial project: not affiliated with or endorsed by NASA.</p></div>";
  }

  // Overlay clicks
  ov.addEventListener("click",function(e){
    var t=e.target.closest("button");
    if(!t)return;
    if(t.dataset.close){closePopup();return;}
    if(t.dataset.resume){resume();return;}
    if(t.dataset.sound){toggleSound();return;}
    if(t.dataset.board){showLeaderboard();return;}
    if(t.dataset.achievements){showAchievements();return;}
    if(t.dataset.nameSave){var nm=(($("pilotName")||{}).value||"").trim().slice(0,20);pilotName=nm||"Pilot";try{localStorage.setItem(NAME_KEY,pilotName);}catch(x){}showLeaderboard("Pilot name saved.");return;}
    if(t.dataset.boardClear){leaderboard=[];try{localStorage.removeItem(BOARD_KEY);}catch(x){}showLeaderboard("Leaderboard cleared.");return;}
    if(t.dataset.cancelbrief){pendingMission=null;menu();return;}
    if(t.dataset.launch&&pendingMission){var mk=pendingMission;pendingMission=null;clearRun();sfx("click");start(mk);return;}
    if(t.dataset.choice){chooseStation(t.dataset.choice);return;}
    if(t.dataset.shop){shop();return;}
    if(t.dataset.acct){account();return;}
    if(t.dataset.switch){emailGate();return;}
    if(t.dataset.copy){
      var co=$("codeOut"),cm=function(m){$("cpMsg").textContent=m;};
      co.focus();co.select();co.setSelectionRange(0,99999);
      var fb=function(){var ok=false;try{ok=document.execCommand("copy");}catch(x){}cm(ok?"Copied!":"Code selected. Press and hold it, then tap Copy.");};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(co.value).then(function(){cm("Copied!");},fb);else fb();
      return;
    }
    if(t.dataset.share){try{navigator.share({title:"My Escape Protocol save",text:$("codeOut").value}).catch(function(){});}catch(x){}return;}
    if(t.dataset.email){
      var ev=($("emIn").value||"").trim().toLowerCase();
      if(!/^[\w.+-]+@[\w-]+(\.[\w-]+)+$/.test(ev)){emailGate("That doesn't look like a valid email.");return;}
      email=ev;try{localStorage.setItem(EMAIL_KEY,ev);}catch(x){}
      loadSave();persist();menu();return;
    }
    if(t.dataset.guest){email="";try{localStorage.setItem(EMAIL_KEY,"guest");}catch(x){}loadSave();menu();return;}
    if(t.dataset.mail){
      account("Copy this code and keep it somewhere safe, like an email to yourself or a note.",true);
      return;
    }
    if(t.dataset.restore){
      try{
        var js=codeToSave($("codeIn").value||"");
        if(typeof JSON.parse(js).coins!=="number")throw 0;
        loadSave(js);persist();account("Save restored!");
      }catch(x){account("That code didn't work. Paste the whole code from your email.");}
      return;
    }
    if(t.dataset.buy){
      var sk=skinById(t.dataset.buy);
      if(save.owned.indexOf(sk.id)>=0){shop();return;}
      if(save.coins<sk.price){shop("Not enough coins for "+sk.name+".");return;}
      save.coins-=sk.price;save.owned.push(sk.id);save.eq[sk.kind]=sk.id;persist();
      shop("Bought and equipped "+sk.name+"!");return;
    }
    if(t.dataset.eq){
      var sk2=skinById(t.dataset.eq);
      save.eq[sk2.kind]=sk2.id;persist();
      shop("Equipped "+sk2.name+".");return;
    }
    if(t.dataset.go){
      if(t.dataset.go==="menu")menu();
      else instructions(t.dataset.go);
    }
  });

  // Keyboard
  window.addEventListener("keydown",function(e){
    if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
    keys[e.key]=true;
    if(S&&!e.repeat){var pi=["1","2","3"].indexOf(e.key);if(pi>=0)usePower(pi);else if(e.key===" ")usePower(0);}
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key)>=0)e.preventDefault();
  });
  window.addEventListener("keyup",function(e){keys[e.key]=false;});

  // Touch pad
  function bindPad(btn){
    var d=btn.dataset.d.split(",").map(Number);
    function down(e){e.preventDefault();held=d;btn.classList.add("on");}
    function up(e){e.preventDefault();if(held&&held[0]===d[0]&&held[1]===d[1])held=null;btn.classList.remove("on");}
    btn.addEventListener("pointerdown",down);
    btn.addEventListener("pointerup",up);
    btn.addEventListener("pointerleave",up);
    btn.addEventListener("pointercancel",up);
  }
  Array.prototype.forEach.call(pad.querySelectorAll("button"),bindPad);
  $("powers").addEventListener("click",function(e){var b=e.target.closest("button[data-slot]");if(b)usePower(+b.dataset.slot);});
  $("saveRun").addEventListener("click",function(){if(S&&!S.over){S.paused=true;saveRun();menu();}});
  var repBtn=$("rep");
  function repOn(e){e.preventDefault();repHeld=true;}
  function repOff(e){e.preventDefault();repHeld=false;}
  repBtn.addEventListener("pointerdown",repOn);
  ["pointerup","pointerleave","pointercancel"].forEach(function(n){repBtn.addEventListener(n,repOff);});

  // Resize
  window.addEventListener("resize",fit);
  if(window.visualViewport)window.visualViewport.addEventListener("resize",fit);
  window.addEventListener("pagehide",saveRun);
  document.addEventListener("visibilitychange",function(){if(document.hidden)saveRun();});

  // Boot
  var savedEm=null;try{savedEm=localStorage.getItem(EMAIL_KEY);}catch(e){}
  if(savedEm&&savedEm!=="guest")email=savedEm;
  loadSave();
  resumeRun=loadRun();
  fit();
  if(savedEm===null)emailGate();else menu();
})();
</script>
